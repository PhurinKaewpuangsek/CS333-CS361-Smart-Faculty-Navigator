name: CI Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ '**' ]

jobs:
  baseline-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Validate Setup
        run: echo "Monorepo Structure and CI connection verified."

      - name: Install, Lint, Test & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run lint
          npm test
          npm run test:ui
          npm run build