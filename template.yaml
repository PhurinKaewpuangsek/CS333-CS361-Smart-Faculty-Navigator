AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Project TORCH — Smart Faculty Navigator (CS333/CS361)
  SAM template defining all Lambda functions, the implicit API Gateway, and DynamoDB tables.

# ---------------------------------------------------------------------------
# Globals — apply to every Lambda function and the single implicit API Gateway
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: nodejs24.x
  Api:
    Cors:
      AllowMethods: "'GET,PUT,OPTIONS'"
      AllowHeaders: "'Content-Type'"
      AllowOrigin: "'*'"

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:
  # Placeholder resource so CloudFormation validation passes while the stack
  # is bootstrapped. Remove this once the first real Lambda resource is added.
  PlaceholderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /torch/placeholder
      RetentionInDays: 7

  SmartFacultyLocations:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SmartFacultyLocations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: location_id
          AttributeType: S
      KeySchema:
        - AttributeName: location_id
          KeyType: HASH

  UpdateLocationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/update-location/
      Handler: index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          TABLE_NAME: !Ref SmartFacultyLocations
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SmartFacultyLocations
      Events:
        UpdateLocation:
          Type: Api
          Properties:
            Path: /api/locations/{location_id}
            Method: put

  GetLocationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/get-locations/
      Handler: index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          TABLE_NAME: !Ref SmartFacultyLocations
      # Read-only by design: this endpoint may Scan the table and nothing else.
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt SmartFacultyLocations.Arn
      Events:
        GetLocations:
          # Type: Api with no RestApiId — joins the single implicit API Gateway
          # whose CORS is configured in Globals. Never declare AWS::Serverless::Api.
          Type: Api
          Properties:
            Path: /api/locations
            Method: get

Outputs:
  ApiUrl:
    Description: Implicit API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"